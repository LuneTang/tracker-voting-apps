<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check App Tracker</title>
<style>
:root{--bg:#fffaf9;--fg:#2a1a19;--head:#f4c7c3;--row:#fbe3e1;--acc:#a30d0d;--line:#e3b3af;--btn:#a30d0d;--btnfg:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1413;--fg:#f3e4e2;--head:#5a2f2c;--row:#3a2321;--acc:#ff8a80;--line:#6b403c;--btn:#ff8a80;--btnfg:#2a0a08;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1413;--fg:#f3e4e2;--head:#5a2f2c;--row:#3a2321;--acc:#ff8a80;--line:#6b403c;--btn:#ff8a80;--btnfg:#2a0a08;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding:12px}
.bar{display:flex;gap:8px;margin-bottom:8px}
button{font:inherit;background:var(--btn);color:var(--btnfg);border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hint{font-size:12px;opacity:.75;margin:0 0 10px}
.wrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;min-width:100%}
th,td{border:1px solid var(--line);padding:8px;text-align:center;min-width:92px}
th{background:var(--head);cursor:pointer;font-weight:600}
th small{display:block;font-weight:400;font-size:11px;opacity:.8}
td{background:var(--row)}
.m{position:sticky;left:0;min-width:170px;text-align:left;background:var(--head);z-index:1}
td.m{background:var(--row)}
td.m{display:table-cell}
.mc{display:flex;align-items:center;justify-content:space-between;gap:6px;word-break:break-all}
.x{background:transparent;color:var(--fg);border:0;padding:2px 6px;opacity:.6}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);width:min(92vw,360px)}
dialog input[type=text],dialog input[type=time],dialog textarea{width:100%;font:inherit;padding:9px;margin:4px 0 12px;border:1px solid var(--line);border-radius:8px;background:var(--row);color:var(--fg)}
dialog label{font-size:13px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:24px;text-align:center;opacity:.8}
.pal{display:flex;gap:12px;margin:0 0 10px;align-items:center}
.pal button{width:28px;height:28px;border-radius:50%;padding:0;border:0}
.pal button[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
</style>
</head>
<body>
<div class="bar"><button id="addMail">+ Mail</button><button id="addApp">+ App</button></div>
<div class="pal" id="pal" role="group" aria-label="Tone màu"></div>
<p class="hint">Chạm tên app để sửa giờ reset hoặc xoá. Giờ reset tính theo giờ Việt Nam (GMT+7).</p>
<div class="wrap"><table id="t"></table></div>
<dialog id="dlg"></dialog>
<script>
const Z=7*3600e3, p=n=>String(n).padStart(2,'0');
let S=null;
try{S=JSON.parse(localStorage.getItem('cat_data'))}catch(e){}
if(!S||!S.apps)S={apps:[],mails:[],checks:{}};
function save(){try{localStorage.setItem('cat_data',JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// Mốc reset gần nhất đã qua (epoch ms), tính theo giờ VN
function due(h,m){const n=Date.now()+Z,d=new Date(n);let t=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),h,m);if(t>n)t-=864e5;return t-Z}
function reset(){let c=false;S.apps.forEach(a=>{const t=due(a.h,a.m);if(a.last<t){S.mails.forEach(x=>delete S.checks[x+'||'+a.name]);a.last=t;c=true}});if(c){save();render()}}
function render(){
  const t=document.getElementById('t');
  if(!S.apps.length&&!S.mails.length){t.innerHTML='<tr><td class="empty">Bắt đầu bằng cách thêm một app, sau đó thêm mail.</td></tr>';return}
  let h='<tr><th class="m" style="cursor:default">Mail</th>'+S.apps.map((a,i)=>`<th data-app="${i}">${esc(a.name)}<small>↻ ${p(a.h)}:${p(a.m)}</small></th>`).join('')+'</tr>';
  h+=S.mails.map((m,j)=>`<tr><td class="m"><div class="mc"><span>${esc(m)}</span><button class="x" data-mail="${j}" aria-label="Xoá mail">✕</button></div></td>`+S.apps.map((a,i)=>`<td><input type="checkbox" data-c="${j}|${i}" ${S.checks[m+'||'+a.name]?'checked':''}></td>`).join('')+'</tr>').join('');
  t.innerHTML=h;
}
const dlg=document.getElementById('dlg');
function mailDlg(){
  dlg.innerHTML='<label>Email (mỗi dòng một mail, dán nhiều mail cùng lúc cũng được)</label><textarea id="v" rows="6"></textarea><div class="acts"><button class="ghost" id="no">Huỷ</button><button id="ok">Thêm mail</button></div>';
  dlg.showModal();
  no.onclick=()=>dlg.close();
  ok.onclick=()=>{const list=document.getElementById('v').value.split(/[\n,;\s]+/).map(x=>x.trim()).filter(Boolean);list.forEach(v=>{if(!S.mails.includes(v))S.mails.push(v)});if(list.length){save();render()}dlg.close()};
}
function appDlg(i){
  const o=i>=0?S.apps[i]:null;
  dlg.innerHTML=`<label>Tên app</label><input type="text" id="n" value="${o?esc(o.name):''}"><label>Giờ reset (giờ VN)</label><input type="time" id="tm" value="${o?p(o.h)+':'+p(o.m):'00:00'}"><div class="acts">${o?'<button class="ghost" id="del">Xoá app</button>':''}<button class="ghost" id="no">Huỷ</button><button id="ok">Lưu</button></div>`;
  dlg.showModal();
  no.onclick=()=>dlg.close();
  if(o)del.onclick=()=>{if(!confirm('Xoá app "'+o.name+'"?'))return;S.mails.forEach(m=>delete S.checks[m+'||'+o.name]);S.apps.splice(i,1);save();render();dlg.close()};
  ok.onclick=()=>{
    const n=document.getElementById('n').value.trim(),tv=document.getElementById('tm').value||'00:00';
    if(!n||S.apps.some((a,k)=>a.name===n&&k!==i))return;
    const [h,m]=tv.split(':').map(Number);
    if(o){S.mails.forEach(x=>{const k=x+'||'+o.name;if(S.checks[k]){S.checks[x+'||'+n]=true;delete S.checks[k]}});o.name=n;o.h=h;o.m=m;o.last=Date.now()}
    else S.apps.push({name:n,h,m,last:Date.now()});
    save();render();dlg.close();
  };
}
document.getElementById('addMail').onclick=mailDlg;
document.getElementById('addApp').onclick=()=>appDlg(-1);
document.getElementById('t').addEventListener('click',e=>{
  const th=e.target.closest('[data-app]');if(th)return appDlg(+th.dataset.app);
  const x=e.target.closest('[data-mail]');
  if(x){const j=+x.dataset.mail,m=S.mails[j];if(confirm('Xoá mail "'+m+'"?')){S.apps.forEach(a=>delete S.checks[m+'||'+a.name]);S.mails.splice(j,1);save();render()}}
});
document.getElementById('t').addEventListener('change',e=>{
  const c=e.target.dataset.c;if(!c)return;
  const [j,i]=c.split('|').map(Number),k=S.mails[j]+'||'+S.apps[i].name;
  if(e.target.checked)S.checks[k]=true;else delete S.checks[k];
  save();
});
const PAL={pink:{n:'Hồng',h:338,s:75,a:48},red:{n:'Đỏ',h:0,s:80},blue:{n:'Xanh dương',h:215,s:70},green:{n:'Xanh lá',h:140,s:45},purple:{n:'Tím',h:270,s:50},yellow:{n:'Vàng',h:45,s:85}};
let pk='pink';try{const v=localStorage.getItem('cat_pal');if(PAL[v])pk=v}catch(e){}
const mq=matchMedia('(prefers-color-scheme: dark)');
function applyPal(){
  const {h,s,a=33}=PAL[pk],d=mq.matches,st=document.documentElement.style,set=(k,v)=>st.setProperty(k,v);
  if(d){set('--head',`hsl(${h},${s*.45}%,25%)`);set('--row',`hsl(${h},${s*.4}%,19%)`);set('--bg',`hsl(${h},25%,10%)`);set('--acc',`hsl(${h},100%,76%)`);set('--line',`hsl(${h},${s*.35}%,32%)`);set('--btn',`hsl(${h},100%,76%)`);set('--btnfg',`hsl(${h},60%,10%)`);set('--fg',`hsl(${h},30%,92%)`)}
  else{set('--head',`hsl(${h},${s}%,83%)`);set('--row',`hsl(${h},${s}%,92%)`);set('--bg',`hsl(${h},60%,98%)`);set('--acc',`hsl(${h},85%,${a}%)`);set('--line',`hsl(${h},${s*.6}%,78%)`);set('--btn',`hsl(${h},85%,${a}%)`);set('--btnfg','#fff');set('--fg',`hsl(${h},30%,12%)`)}
  document.getElementById('pal').innerHTML=Object.entries(PAL).map(([k,v])=>`<button data-p="${k}" title="${v.n}" aria-label="${v.n}" aria-pressed="${k===pk}" style="background:hsl(${v.h},${Math.max(v.s,60)}%,45%)"></button>`).join('');
}
document.getElementById('pal').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;pk=b.dataset.p;try{localStorage.setItem('cat_pal',pk)}catch(x){}applyPal()});
mq.addEventListener('change',applyPal);
applyPal();
render();reset();
setInterval(reset,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)reset()});
</script>
</body>
</html>
